[project]
name = "fihy-backend"
version = "0.1.0"
description = "FastAPI service implementing docs/api-contract.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "boto3>=1.35",
    "pillow>=11.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.17",
    "alembic>=1.14",
    "google-auth>=2.57.0",
    "openai>=3.22.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
