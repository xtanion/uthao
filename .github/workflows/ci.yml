name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: tests
        run: uv run pytest -q
      - name: migrations match the models
        # A schema that only exists in create_all passes every other test and
        # breaks the deploy.
        run: |
          DATABASE_URL="sqlite+aiosqlite:///./ci.db" uv run alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:///./ci.db" uv run alembic check
      - name: the image builds
        run: docker build -t fihy-backend .

  backend-postgres:
    # SQLite does not enforce VARCHAR lengths, so a value the real database
    # rejects passes every test. Run the same suite where it is enforced.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fihy
          POSTGRES_DB: fihy
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:fihy@localhost:5432/fihy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - name: migrations run on postgres too
        # The suite leaves its create_all tables behind, and an upgrade onto
        # them fails on the first CREATE TABLE. Start from an empty schema.
        run: |
          psql "postgresql://postgres:fihy@localhost:5432/fihy" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
